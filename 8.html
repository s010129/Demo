<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通知頁 - TNRFeeder</title>
  <style>
    /* 讓頁面撐滿高度並推 footer 底部 */
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background-color: #fff8f0;
      color: #333;
    }
    header {
      background-color: #ffe4e1;
      display: flex;
      align-items: center;
      padding: 10px 20px;
    }
    /* 回首頁按鈕樣式 */
    .logo-btn {
      background-color: #BDB76B; /* 深卡其 */
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      display: inline-block;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 500px;
      background-color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      font-size: 1rem;
    }
    th {
      background-color: #ffe4e1;
    }
    tr:last-child td {
      border-bottom: none;
    }
    footer {
      background-color: #ffe4e1;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo-btn">回首頁</a>
</header>

<main>
  <table>
    <thead>
      <tr>
        <th>通知公告</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>🔔系統將於 5/05 進行例行維護，屆時無法使用餵食功能。</td></tr>
	  <tr><td>🔔5/6維護完成後新增動物明星功能。</td></tr>
      <tr><td>🔔新機器已部署於校園南側，歡迎前往體驗。</td></tr>
      <tr><td>🔔即日起增加「夜間模式」直播切換功能。</td></tr>
      <tr><td>🔔4/30 － 5/07 期間，所有點數贈送雙倍回饋。</td></tr>
      <tr><td>🔔App 將於下週更新，請於 App Store／Google Play 下載新版。</td></tr>
      <tr><td>🔔官方紀念品商店新品上架，數量有限，售完為止。</td></tr>
	  <tr><td>🔔5/31舉辦阿黑告別式。</td></tr>
    </tbody>
  </table>
</main>

<footer>
  <p>© 2025 TNRFeeder. All Rights Reserved.</p>
</footer>

</body>
</html>
