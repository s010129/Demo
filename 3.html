<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>機器介紹 - TNRFeeder</title>
  <style>
    /* 讓頁面撐滿高度並推 footer 底部 */
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background-color: #fff8f0;
      color: #333;
    }
    header {
      background-color: #ffe4e1;
      display: flex;
      align-items: center;
      padding: 10px 20px;
    }
    /* 回首頁按鈕樣式 */
    .logo-btn {
      background-color: #BDB76B; /* 深卡其 */
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      display: inline-block;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .image-container {
      max-width: 90%;
      overflow: hidden;
    }
    .image-container img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: zoom-in;
      transition: transform 0.3s ease;
    }
    .image-container img:active {
      transform: scale(2);
      cursor: zoom-out;
    }
    footer {
      background-color: #ffe4e1;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo-btn">回首頁</a>
</header>

<main>
  <div class="image-container">
    <img src="2.png" alt="TNRFeeder 圖片展示">
  </div>
</main>

<footer>
  <p>© 2025 TNRFeeder. All Rights Reserved.</p>
</footer>

</body>
</html>
