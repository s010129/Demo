<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TNRFeeder - Live Demo</title>
  <style>
    /* 讓頁面撐滿高度並推 footer 底部 */
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background-color: #fff8f0;
      color: #333;
    }
    header {
      background-color: #ffe4e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header nav {
      display: flex;
      gap: 30px; /* 連結間距 */
    }
    header nav a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    /* Logo 與登入按鈕同寬高、圓角框效果 */
    .logo-btn, .login-btn {
      font-size: 1rem;
      padding: 8px 12px;
      border: none;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      display: inline-block;
    }
    .logo-btn {
      background-color: #BDB76B; /* 深卡其 */
      color: white;
    }
    .login-btn {
      background-color: #ffb6b9;
      color: white;
    }
    .container {
      flex: 1; /* 中間內容撐滿剩餘空間 */
      display: flex;
      flex-direction: row;
      margin: 20px;
    }
    aside {
      width: 200px;
      background-color: #fff0f5;
      padding: 15px;
      border-radius: 10px;
      height: fit-content;
    }
    aside a {
      display: block;
      margin: 10px 0;
      text-decoration: none;
      color: #666;
    }
    main {
      flex: 1;
      margin-left: 20px;
    }
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-between;
    }
    .feature-item {
      background-color: #ffffff;
      flex: 1 1 calc(30% - 20px);
      min-width: 250px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      text-decoration: none;
      color: inherit;
    }
    .feature-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }
    footer {
      background-color: #ffe4e1;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      border-top: 1px solid #ccc;
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      aside {
        width: 100%;
        margin-bottom: 20px;
      }
      .features {
        gap: 10px;
        justify-content: center;
      }
      .feature-item {
        flex: 1 1 calc(45% - 10px);
      }
    }
    @media (max-width: 480px) {
      .feature-item {
        flex: 1 1 calc(45% - 10px);
      }
    }
  </style>
</head>
<body>

<header>

</header>

</html>
